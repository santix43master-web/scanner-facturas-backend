<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Facturas R21 | Interfaz Avanzada Optimizada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-deep: #010205;
  --surface-dark: #080b14;
  --surface-light: #111827;
  
  --neon-cyan: #00f3ff;
  --neon-cyan-dim: rgba(0, 243, 255, 0.15);
  --neon-purple: #bc13fe;
  --neon-purple-dim: rgba(188, 19, 254, 0.15);
  --neon-green: #00ff66;
  --neon-red: #ff2a6d;
  
  --border-subtle: #1a2333;
  
  --text-main: #e0f8ff;
  --text-muted: #6b8a9e;
  
  --font-ui: 'Space Grotesk', sans-serif;
  --font-display: 'Rajdhani', sans-serif;
  --font-mono: 'Space Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body { 
  font-family: var(--font-ui); 
  background-color: var(--bg-deep); 
  color: var(--text-main); 
  min-height: 100vh;
  overflow-x: hidden;
}

.bg-grid {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: -1;
  background-image: 
    linear-gradient(var(--border-subtle) 1px, transparent 1px),
    linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px);
  background-size: 40px 40px;
  transform: translateZ(0);
  opacity: 0.6;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--neon-cyan); }

.app-container {
  max-width: 800px;
  margin: 0 auto;
  position: relative;
}

.header {
  background: var(--surface-dark);
  padding: 24px 20px 24px;
  position: sticky; 
  top: 0; 
  z-index: 100;
  border-bottom: 1px solid var(--neon-cyan);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
}

.header-top { 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  margin-bottom: 20px; 
}

.header h1 { 
  font-family: var(--font-display);
  font-size: 28px; 
  font-weight: 700; 
  letter-spacing: 2px;
  text-transform: uppercase;
}
.header h1 span { color: var(--neon-cyan); }

.header-badge { 
  background: rgba(0, 255, 102, 0.1); 
  color: var(--neon-green); 
  border: 1px solid var(--neon-green);
  font-size: 12px; 
  font-family: var(--font-mono);
  font-weight: 700; 
  padding: 4px 12px; 
  border-radius: 4px; 
  display: flex;
  align-items: center;
  gap: 6px;
}

.badge-dot {
  width: 6px; height: 6px;
  background: var(--neon-green);
  border-radius: 50%;
  animation: pulseOpacity 1.5s ease-in-out infinite;
}

.stats { display: flex; gap: 16px; }
.stat-card {
  flex: 1; 
  background: var(--surface-light); 
  border-radius: 4px; 
  padding: 16px;
  border: 1px solid var(--border-subtle); 
  border-left: 3px solid var(--neon-cyan);
}
.stat-card:nth-child(2) { border-left-color: var(--neon-purple); }

.stat-card .label { 
  font-size: 11px; 
  font-family: var(--font-mono);
  color: var(--text-muted); 
  text-transform: uppercase; 
  letter-spacing: 1.5px; 
}
.stat-card .value { 
  font-family: var(--font-display);
  font-size: 26px; 
  font-weight: 700; 
  margin-top: 8px; 
  color: var(--text-main); 
}
.stat-card .value.cyan { color: var(--neon-cyan); }
.stat-card .value.purple { color: var(--neon-purple); }

.buscar {
  padding: 20px 20px 10px; 
  position: sticky; 
  top: 135px; 
  z-index: 99;
  background: var(--bg-deep);
  border-bottom: 1px solid var(--border-subtle);
}
.buscar-inner {
  display: flex; gap: 8px; 
  background: var(--surface-light); 
  border-radius: 4px;
  padding: 6px; 
  border: 1px solid var(--border-subtle);
}
.buscar input {
  flex: 1; padding: 12px 16px; background: transparent; border: none;
  color: var(--neon-cyan); font-size: 15px; font-family: var(--font-mono); outline: none;
}
.buscar input::placeholder { color: var(--text-muted); }
.buscar button {
  padding: 10px 24px; 
  background: var(--surface-dark); 
  color: var(--neon-cyan); 
  border: 1px solid var(--neon-cyan);
  border-radius: 2px; cursor: pointer; 
  font-size: 14px; font-weight: 700; font-family: var(--font-display);
  letter-spacing: 1px; text-transform: uppercase;
  transition: background-color 0.2s, color 0.2s;
}
.buscar button:hover { 
  background: var(--neon-cyan); 
  color: var(--bg-deep);
}

.lista { padding: 10px 20px 100px; display: flex; flex-direction: column; gap: 12px; }

.factura-card {
  background: var(--surface-light); 
  border-radius: 4px; 
  border: 1px solid var(--border-subtle); 
  position: relative;
  transition: transform 0.2s, border-color 0.2s;
  content-visibility: auto; 
  contain-intrinsic-size: 80px; 
}
.factura-card::before {
  content: ''; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 4px;
  background: var(--text-muted); border-radius: 4px 0 0 4px; transition: background-color 0.2s;
}
.factura-card:hover { 
  border-color: var(--neon-cyan); 
  transform: translateX(4px);
}
.factura-card:hover::before { background: var(--neon-cyan); }
.factura-card.abierto::before { background: var(--neon-purple); }
.factura-card.abierto { border-color: var(--neon-purple); }

.factura-header {
  padding: 16px 20px; display: flex; justify-content: space-between;
  align-items: center; cursor: pointer; gap: 12px;
}
.factura-header .izq { flex: 1; min-width: 0; }
.factura-header .numero {
  font-family: var(--font-mono); font-size: 15px; color: var(--text-main);
  display: flex; align-items: center; gap: 8px; font-weight: 700;
}
.factura-header .numero .hash { color: var(--neon-purple); font-weight: bold; }
.factura-header .vendedor { 
  font-size: 13px; color: var(--text-muted); margin-top: 4px; 
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
}
.factura-header .der { text-align: right; flex-shrink: 0; }
.factura-header .total { 
  font-family: var(--font-mono); font-weight: 700; font-size: 16px; color: var(--neon-cyan); 
}
.factura-header .fecha { font-size: 12px; font-family: var(--font-mono); color: var(--text-muted); margin-top: 4px; }

.sucursal-tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; font-family: var(--font-mono); font-weight: 700;
  background: var(--surface-dark); color: #d473ff;
  padding: 2px 8px; border-radius: 2px; margin-top: 8px;
  border: 1px solid var(--neon-purple-dim);
  text-transform: uppercase;
}

.flecha {
  display: inline-block; transition: transform 0.3s;
  font-size: 10px; color: var(--text-muted); margin-left: 10px;
}
.factura-card.abierto .flecha { transform: rotate(180deg); color: var(--neon-purple); }

.factura-detalles {
  display: none;
  background: var(--surface-dark); 
  border-top: 1px solid var(--border-subtle);
}
.factura-detalles.abierto { display: block; }

.detalle-content { padding: 20px; }

.detalle-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.meta-chip {
  font-size: 11px; font-family: var(--font-mono); padding: 4px 8px;
  background: var(--surface-light); color: var(--text-muted); border: 1px solid var(--border-subtle);
}
.meta-chip strong { color: var(--neon-cyan); font-weight: normal; }

.items-header {
  font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--text-muted);
  text-transform: uppercase; margin-bottom: 12px;
  padding-bottom: 8px; border-bottom: 1px solid var(--border-subtle);
  display: flex; justify-content: space-between;
}

.item-row {
  display: flex; align-items: flex-start; padding: 10px 0;
  border-bottom: 1px solid var(--border-subtle); gap: 12px;
}
.item-row:last-child { border-bottom: none; }
.item-num {
  width: 24px; height: 24px; border-radius: 2px; display: flex;
  align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11px;
  background: var(--surface-light); color: var(--text-muted); flex-shrink: 0;
  border: 1px solid var(--border-subtle);
}
.item-info { flex: 1; min-width: 0; }
.item-desc { font-size: 13px; color: var(--text-main); margin-bottom: 4px; }
.item-sub { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
.item-precio { font-family: var(--font-mono); font-size: 13px; color: var(--neon-cyan); flex-shrink: 0; text-align: right; }

.totales-box {
  background: var(--surface-light); border-radius: 4px; padding: 16px;
  margin-top: 16px; border: 1px solid var(--border-subtle);
}
.totales-line {
  display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 12px;
  padding: 4px 0; color: var(--text-muted);
}
.totales-line.total-line {
  font-size: 16px; font-family: var(--font-display); font-weight: 700; color: var(--text-main);
  padding-top: 10px; margin-top: 6px; border-top: 1px solid var(--neon-cyan-dim);
}
.totales-line.total-line .monto { color: var(--neon-cyan); }

.loading { text-align: center; padding: 40px 20px; color: var(--neon-cyan); font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; }
.spinner {
  width: 30px; height: 30px; border: 2px solid var(--surface-light);
  border-top-color: var(--neon-cyan); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin: 0 auto 12px;
}

.empty-state { text-align: center; padding: 60px 20px; background: var(--surface-light); border: 1px solid var(--border-subtle); }
.empty-state h3 { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--neon-red); margin-bottom: 8px; }
.empty-state p { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }

.auto-refresh {
  display: flex; align-items: center; gap: 8px; justify-content: center;
  margin-top: 12px; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted);
  text-transform: uppercase;
}
.auto-refresh input[type=checkbox] {
  appearance: none; width: 32px; height: 16px; background: var(--surface-light);
  border-radius: 8px; position: relative; cursor: pointer;
  border: 1px solid var(--border-subtle); transition: background-color 0.2s;
}
.auto-refresh input[type=checkbox]:checked { background: var(--neon-cyan); border-color: var(--neon-cyan); }
.auto-refresh input[type=checkbox]::after {
  content: ''; position: absolute; top: 1px; left: 1px; width: 12px; height: 12px;
  background: var(--bg-deep); border-radius: 50%; transition: transform 0.2s;
}
.auto-refresh input[type=checkbox]:checked::after { transform: translateX(16px); }
.auto-refresh label { cursor: pointer; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulseOpacity { 
  0%, 100% { opacity: 1; } 
  50% { opacity: 0.3; } 
}
</style>
</head>
<body>

<div class="bg-grid"></div>

<div class="app-container">
  <div class="header">
    <div class="header-top">
      <h1><span>Facturas</span>_SYS</h1>
      <div class="header-badge" id="headerBadge">
        <div class="badge-dot" id="badgeDot"></div>
        <span id="badgeText">SYNCING</span>
      </div>
    </div>
    <div class="stats">
      <div class="stat-card">
        <div class="label">Registros</div>
        <div class="value cyan" id="stat-total">--</div>
      </div>
      <div class="stat-card">
        <div class="label">Volumen Total</div>
        <div class="value purple" id="stat-monto">Gs. 0</div>
      </div>
    </div>
    <div class="auto-refresh">
      <input type="checkbox" id="autoRefresh" checked>
      <label for="autoRefresh">Auto-Sync Uplink</label>
    </div>
  </div>

  <div class="buscar">
    <div class="buscar-inner">
      <input type="text" id="busqueda" placeholder="ID, AGENTE, SECTOR...">
      <button onclick="cargar()">Analizar</button>
    </div>
  </div>

  <div class="lista" id="lista">
    <div class="loading">
      <div class="spinner"></div>
      Estableciendo enlace seguro...
    </div>
  </div>
</div>

<script>
const API = window.location.origin;
let facturas = [];
let timer = null;

async function cargar() {
  actualizarBadge('loading');
  try {
    const resp = await fetch(API + '/facturas-db?limite=500');
    const data = await resp.json();
    facturas = data.facturas || [];
    actualizarBadge('live');
    renderizar();
  } catch(e) {
    document.getElementById('lista').innerHTML = '<div class="empty-state"><h3>OFFLINE</h3><p>No se pudo conectar al servidor.</p></div>';
    actualizarBadge('offline');
  }
}

function actualizarBadge(estado) {
  const text = document.getElementById('badgeText');
  const dot = document.getElementById('badgeDot');
  const badge = document.getElementById('headerBadge');
  
  if(estado === 'loading') {
    text.textContent = 'SYNC...';
    badge.style.borderColor = 'var(--text-muted)'; badge.style.color = 'var(--text-muted)';
    dot.style.background = 'var(--text-muted)'; dot.style.animation = 'none';
  } else if (estado === 'live') {
    text.textContent = 'EN LINEA';
    badge.style.borderColor = 'var(--neon-green)'; badge.style.color = 'var(--neon-green)';
    dot.style.background = 'var(--neon-green)'; dot.style.animation = 'pulseOpacity 1.5s infinite';
  } else {
    text.textContent = 'OFFLINE';
    badge.style.borderColor = 'var(--neon-red)'; badge.style.color = 'var(--neon-red)';
    dot.style.background = 'var(--neon-red)'; dot.style.animation = 'none';
  }
}

function renderizar() {
  const q = document.getElementById('busqueda').value.toLowerCase();
  let filtradas = facturas;
  if (q) {
    filtradas = facturas.filter(f => 
      (f.numero && f.numero.toLowerCase().includes(q)) ||
      (f.vendedor && f.vendedor.toLowerCase().includes(q)) ||
      (f.sucursal && f.sucursal.toLowerCase().includes(q))
    );
  }

  let montoTotal = 0;
  for(let i=0; i<filtradas.length; i++) montoTotal += (filtradas[i].total || 0);
  
  document.getElementById('stat-total').textContent = filtradas.length.toString().padStart(3, '0');
  document.getElementById('stat-monto').textContent = 'Gs. ' + montoTotal.toLocaleString('es-PY');

  const contenedor = document.getElementById('lista');

  if (filtradas.length === 0) {
    contenedor.innerHTML = '<div class="empty-state"><h3>VACIO</h3><p>Sin coincidencias en la red.</p></div>';
    return;
  }

  let html = '';
  for(let i=0; i<filtradas.length; i++) {
    const f = filtradas[i];
    html += `
      <div class="factura-card" id="card-${f.id}">
        <div class="factura-header" onclick="toggle(${f.id})">
          <div class="izq">
            <div class="numero"><span class="hash">[#]</span> ${f.numero || 'S/N'}</div>
            <div class="vendedor">OP: ${f.vendedor || 'NO_IDENTIFICADO'}</div>
            ${f.sucursal ? '<span class="sucursal-tag">' + f.sucursal + '</span>' : ''}
          </div>
          <div class="der">
            <div class="total">Gs. ${(f.total || 0).toLocaleString('es-PY')}</div>
            <div class="fecha">${f.fecha || ''}</div>
            <span class="flecha" id="flecha-${f.id}">&#9660;</span>
          </div>
        </div>
        <div class="factura-detalles" id="det-${f.id}">
          <div class="detalle-content" id="det-content-${f.id}">
            <div class="loading"><div class="spinner"></div>Descifrando datos...</div>
          </div>
        </div>
      </div>
    `;
  }
  contenedor.innerHTML = html;
}

async function toggle(id) {
  const card = document.getElementById('card-' + id);
  const det = document.getElementById('det-' + id);
  const content = document.getElementById('det-content-' + id);
  
  if (card.classList.contains('abierto')) {
    card.classList.remove('abierto');
    det.classList.remove('abierto');
    return;
  }
  
  const abiertos = document.querySelectorAll('.factura-card.abierto');
  for(let i=0; i<abiertos.length; i++) {
    abiertos[i].classList.remove('abierto');
    abiertos[i].querySelector('.factura-detalles').classList.remove('abierto');
  }

  card.classList.add('abierto');
  det.classList.add('abierto');

  try {
    const resp = await fetch(API + '/factura-db/' + id);
    const data = await resp.json();

    if (data.error) {
      content.innerHTML = '<div style="color:var(--neon-red); font-family:var(--font-mono); text-align:center;">ERROR: ' + data.error + '</div>';
      return;
    }

    let html = '<div class="detalle-meta">';
    if (data.ruc) html += `<span class="meta-chip">RUC: <strong>${data.ruc}</strong></span>`;
    if (data.timbrado) html += `<span class="meta-chip">AUTH: <strong>${data.timbrado}</strong></span>`;
    if (data.vendedor) html += `<span class="meta-chip">OP: <strong>${data.vendedor}</strong></span>`;
    html += '</div>';

    const items = data.items || [];
    if (items.length > 0) {
      html += `<div class="items-header"><span>Articulos</span><span>[${items.length}]</span></div>`;
      for(let i=0; i<items.length; i++) {
        const it = items[i];
        html += `<div class="item-row">
          <div class="item-num">${(i + 1).toString().padStart(2, '0')}</div>
          <div class="item-info">
            <div class="item-desc">${it.descripcion || 'Sin datos'}</div>
            <div class="item-sub">CANT: ${it.cantidad || 1} | UNIT: Gs. ${(it.precio_unitario || 0).toLocaleString('es-PY')}</div>
          </div>
          <div class="item-precio">Gs. ${(it.precio_total || 0).toLocaleString('es-PY')}</div>
        </div>`;
      }
    }

    html += '<div class="totales-box">';
    if (data.total_exentas > 0) html += `<div class="totales-line"><span>EXENTO</span><span>Gs. ${Number(data.total_exentas).toLocaleString('es-PY')}</span></div>`;
    if (data.total_iva5 > 0) html += `<div class="totales-line"><span>IVA_05</span><span>Gs. ${Number(data.total_iva5).toLocaleString('es-PY')}</span></div>`;
    if (data.total_iva10 > 0) html += `<div class="totales-line"><span>IVA_10</span><span>Gs. ${Number(data.total_iva10).toLocaleString('es-PY')}</span></div>`;
    html += `<div class="totales-line total-line"><span>TOTAL_NETO</span><span class="monto">Gs. ${Number(data.total_general).toLocaleString('es-PY')}</span></div>`;
    html += '</div>';

    content.innerHTML = html;
  } catch(e) {
    content.innerHTML = '<div style="color:var(--neon-red); font-family:var(--font-mono); text-align:center;">Falla critica de enlace.</div>';
  }
}

document.getElementById('busqueda').addEventListener('input', renderizar);

cargar();
timer = setInterval(() => {
  if (document.getElementById('autoRefresh').checked) cargar();
}, 30000);
</script>
</body>
</html>
